resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server web:8080 resolve;
}

server {
    listen 80;
    server_name 52.79.241.143.nip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://52.79.241.143.nip.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 52.79.241.143.nip.io;
    ssl_certificate /etc/letsencrypt/live/52.79.241.143.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/52.79.241.143.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
