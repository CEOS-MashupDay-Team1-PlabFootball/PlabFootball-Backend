spring:
  application:
    name: PlabFootballBackend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

app:
  images:
    base-url: ${IMAGE_BASE_URL}
  cookie:
    secure: ${COOKIE_SECURE:true}
